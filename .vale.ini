# Vale suggests a few style and readability fixes. The CI job
# (.github/workflows/vale.yml) annotates only the lines a pull request adds
# and never fails. Rules live in .github/styles/AgentManager/.
# Run `vale <path>` to check a page locally.
StylesPath = .github/styles
MinAlertLevel = suggestion

# Read MDX as Markdown. Vale's MDX parser rejects Docusaurus syntax such as
# heading IDs (`## Title {#id}`), and one unparseable file stops the run.
[formats]
mdx = md

[*.{md,mdx}]
# Docusaurus admonition markers with their titles, and MDX comments.
TokenIgnores = (:::\w*[^\n]*), (\{/\*[\s\S]*?\*/\})

# Only the docs. Other Markdown, such as the docs skill, quotes these terms on purpose.
# The leading **/ also matches the absolute paths editor integrations lint by.
[**/{docs,versioned_docs}/**/*.{md,mdx}]
BasedOnStyles = AgentManager

# The docs skill sits under .claude/skills/docs/, which the section above also matches.
[**/.claude/**/*.md]
BasedOnStyles =

# Generated from the upstream Helm charts; fix wording in the chart values.
[**/{docs,versioned_docs/*}/reference/helm-charts/*.mdx]
BasedOnStyles =
